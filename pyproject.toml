[project]
name = "diligence-room"
version = "0.1.0"
description = "Zero-trust runtime for autonomous institutional agent fleets, demonstrated through M&A due diligence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Diligence Room" }]
dependencies = [
    "google-adk>=1.5.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.100.0",
    "google-cloud-pubsub>=2.21",
    "google-genai>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agents",
    "armor",
    "compliance",
    "coordination",
    "dashboard",
    "evals",
    "gateway",
    "identity",
    "infra",
    "ingestion",
    "memory",
    "observability",
    "redteam",
    "registry",
    "runtime",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".git", ".venv", ".codegraph", ".omo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "C4"]

[tool.ruff.lint.isort]
known-first-party = [
    "agents",
    "armor",
    "compliance",
    "coordination",
    "dashboard",
    "evals",
    "gateway",
    "identity",
    "infra",
    "ingestion",
    "memory",
    "observability",
    "redteam",
    "registry",
    "runtime",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "google.*",
    "vertexai.*",
    "google_cloud_aiplatform.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
