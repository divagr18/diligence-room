# Local-system hooks: everything runs through the uv-managed venv,
# no hook-repo downloads needed (keeps CI/airgapped behavior deterministic).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy (strict)
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false

      - id: gitleaks
        name: gitleaks (secrets scan)
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
        stages: [pre-commit]

