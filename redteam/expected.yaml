# Red-team attack ledger, 14 fixtures (BUILD_PLAN D6-M6 batch #1, D7-M5 batch #2, D10-M5 batch #3).
# "quarantined" = never reaches agent context; the pipeline emits a security
# event instead of routing and writes a quarantine record. `layer` names the
# screening stage that must do the catching: sentinel_tripwire (cheap regex
# tripwire before classification) or model_armor (project rules + managed
# screening after classification, vision S8 order). `reason` is the sentinel
# pattern name (batch #1) or the armor reason_code (batch #2).
